<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本清理工具 · 免费在线去除空格空行</title>
    <style>
        /* ----- 样式简洁，保留你原有的暗色变量 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --muted: #64748b;
            --accent: #3b82f6;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --radius: 16px;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 30px 40px;
            border: 1px solid var(--border);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--border);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 24px;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .keep-chars-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            margin-left: 0;
        }
        .keep-chars-wrapper input {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 14px;
            font-family: 'Menlo', monospace;
            width: 180px;
            height: 34px;
            outline: none;
            transition: border 0.2s;
        }
        .keep-chars-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
        }
        .keep-chars-wrapper .hint-text {
            font-size: 12px;
            color: var(--muted);
        }
        .textarea-wrapper {
            position: relative;
        }
        textarea {
            width: 100%;
            min-height: 320px;
            padding: 18px 20px;
            font-size: 15px;
            line-height: 1.7;
            font-family: 'Menlo', 'Cascadia Code', monospace;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 32px;
            margin-top: 16px;
            font-size: 14px;
            color: var(--muted);
            padding: 10px 0 6px;
            border-top: 1px solid var(--border);
        }
        .stats span {
            font-weight: 500;
            color: var(--text);
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            justify-content: space-between;
            align-items: center;
        }
        .actions .left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .privacy-badge {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .privacy-badge svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        .ad-container {
            display: none !important;
        }
        .ad-container-sidebar {
            display: none !important;
        }
        .ad-desktop-only {
            display: none !important;
        }
        @media (max-width: 640px) {
            .container { padding: 16px; }
            h1 { font-size: 20px; }
            textarea { min-height: 220px; }
            .options-grid { gap: 10px; }
            .actions { flex-direction: column; align-items: stretch; }
            .actions .left { justify-content: center; }
            .keep-chars-wrapper input { width: 120px; }
        }
        .hint-spaces {
            font-size: 12px;
            color: var(--muted);
            margin-left: 26px;
            margin-top: -8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="siteTitle">🧹 文本清理工具</h1>
        <div class="toolbar">
            <button class="btn" id="langToggle">🌐 English</button>
            <button class="btn" id="themeToggle">🌙 暗色</button>
            <button class="btn btn-primary" id="resetBtn">↺ 重置</button>
        </div>
    </header>

    <div class="ad-container" id="adSlot1"><div class="ad-placeholder-text">📢 广告位 1</div></div>

    <div class="options-grid" id="optionsContainer">
        <!-- 核心清理 -->
        <label class="option-item"><input type="checkbox" id="optTrim" checked /><span>去除首尾空格</span></label>
        <label class="option-item"><input type="checkbox" id="optMultipleSpaces" checked /><span>合并多个空格</span></label>
        <label class="option-item"><input type="checkbox" id="optRemoveEmptyLines" checked /><span>删除空行</span></label>
        <label class="option-item"><input type="checkbox" id="optUnifyLineBreaks" checked /><span>统一换行符 (LF)</span></label>
        <label class="option-item"><input type="checkbox" id="optRemoveAllSpaces" /><span>移除所有空格（中文/英文）</span></label>

        <!-- 高级清理 -->
        <div style="flex-basis:100%; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin-top:8px; padding-top:12px; border-top:1px solid var(--border);">
            <label class="option-item"><input type="checkbox" id="optRemoveSpecial" /><span>移除特殊符号（保留字母/数字/中文）</span></label>
            <div class="keep-chars-wrapper">
                <span>保留额外字符：</span>
                <input type="text" id="keepCharsInput" placeholder='例如 # @ ￥ / +' />
                <span class="hint-text">（常用标点已默认保留）</span>
            </div>
        </div>

        <div style="flex-basis:100%; display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px; margin-top:4px;">
            <label class="option-item" style="margin-right:8px;"><input type="checkbox" id="optKeepTranscriptFormat" /><span>🔊 保留音频转文字稿格式</span></label>
            <span style="font-size:13px; color:var(--muted);">大小写：</span>
            <label class="option-item"><input type="checkbox" id="optUpperCase" /><span>转大写</span></label>
            <label class="option-item"><input type="checkbox" id="optLowerCase" /><span>转小写</span></label>
            <label class="option-item"><input type="checkbox" id="optCapitalize" /><span>首字母大写</span></label>
        </div>

        <!-- 中文排版 -->
        <div style="flex-basis:100%; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin-top:8px; padding-top:12px; border-top:1px solid var(--border);">
            <span style="font-weight:500; font-size:14px; color:var(--muted);">🇨🇳 中文排版</span>
            <label class="option-item"><input type="checkbox" id="optIndent" /><span>段首缩进两格</span></label>
            <div style="display:flex; align-items:center; gap:4px; font-size:14px;">
                <span>行距：</span>
                <input type="number" id="lineHeightInput" value="28" min="12" max="60" step="1" style="width:70px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:14px; outline:none;" />
                <span style="color:var(--muted);">磅</span>
                <label class="option-item" style="margin-left:12px;"><input type="checkbox" id="optMoneyUppercase" /><span>大写金额</span></label>
            </div>
        </div>
    </div>

    <div class="hint-spaces">💡 “合并多个空格”只将多个空格缩成一个，不删除单个空格；“移除所有空格”会删除全部空格。</div>

    <div class="textarea-wrapper"><textarea id="inputText" placeholder="在此粘贴或输入需要清理的文本……"></textarea></div>

    <div class="stats" id="statsDisplay">
        <span>字符数 <span id="charCount">0</span></span>
        <span>单词数 <span id="wordCount">0</span></span>
        <span>行数 <span id="lineCount">0</span></span>
    </div>

    <div class="actions">
        <div class="left">
            <button class="btn" id="copyBtn">📋 复制结果</button>
            <button class="btn" id="downloadBtn">⬇ 下载 .txt</button>
        </div>
        <div class="privacy-badge">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            <span>所有处理在本地完成 · 不上传服务器</span>
        </div>
    </div>

    <div style="text-align:center; margin-top:30px; padding-top:20px; border-top:1px solid var(--border); font-size:14px; color:var(--muted);">
        <a href="privacy.html" style="color:var(--accent); text-decoration:none;">隐私政策</a> · 
        <a href="about.html" style="color:var(--accent); text-decoration:none;">关于</a> · 
        <a href="contact.html" style="color:var(--accent); text-decoration:none;">联系我们</a>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 引用 ----------
        const inputEl = document.getElementById('inputText');
        const charSpan = document.getElementById('charCount');
        const wordSpan = document.getElementById('wordCount');
        const lineSpan = document.getElementById('lineCount');

        const optTrim = document.getElementById('optTrim');
        const optMultipleSpaces = document.getElementById('optMultipleSpaces');
        const optRemoveAllSpaces = document.getElementById('optRemoveAllSpaces');
        const optRemoveEmptyLines = document.getElementById('optRemoveEmptyLines');
        const optUnifyLineBreaks = document.getElementById('optUnifyLineBreaks');
        const optRemoveSpecial = document.getElementById('optRemoveSpecial');
        const optUpperCase = document.getElementById('optUpperCase');
        const optLowerCase = document.getElementById('optLowerCase');
        const optCapitalize = document.getElementById('optCapitalize');
        const optKeepTranscriptFormat = document.getElementById('optKeepTranscriptFormat');
        const optIndent = document.getElementById('optIndent');
        const optMoneyUppercase = document.getElementById('optMoneyUppercase');
        const lineHeightInput = document.getElementById('lineHeightInput');
        const keepCharsInput = document.getElementById('keepCharsInput');

        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');

        // ---------- 工具函数：正则转义 ----------
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ---------- 工具函数：数字转中文大写金额 ----------
        function numberToChinese(num) {
            if (isNaN(num) || num === null || num === undefined) return '';
            const digits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            const units = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿', '拾', '佰', '仟'];
            const decimalUnits = ['角', '分'];

            let numStr = num.toString();
            let parts = numStr.split('.');
            let integerPart = parts[0];
            let decimalPart = parts.length > 1 ? parts[1].padEnd(2, '0') : '00';

            if (integerPart === '0' && decimalPart === '00') return '零元整';

            let result = '';
            let integerDigits = integerPart.split('').reverse();
            let zeroFlag = false;

            for (let i = 0; i < integerDigits.length; i++) {
                let digit = parseInt(integerDigits[i]);
                let unit = units[i] || '';
                if (digit === 0) {
                    zeroFlag = true;
                    continue;
                }
                if (zeroFlag) {
                    result = '零' + result;
                    zeroFlag = false;
                }
                result = digits[digit] + unit + result;
            }
            result += '元';

            let jiao = parseInt(decimalPart[0]);
            let fen = parseInt(decimalPart[1]);
            if (jiao === 0 && fen === 0) {
                result += '整';
            } else {
                if (jiao > 0) result += digits[jiao] + '角';
                if (fen > 0) result += digits[fen] + '分';
            }
            return result;
        }

        function convertMoneyInText(text) {
            // 匹配：数字（含小数），后面跟“元”或“块”
            const regex = /(\d+\.?\d*)\s*[元块]/g;
            return text.replace(regex, (match, num) => {
                const chinese = numberToChinese(parseFloat(num));
                return chinese || match;
            });
        }

        // ---------- 核心清理函数 ----------
        function cleanText(text) {
            if (!text) return '';

            let result = text;

            try {
                // 1. 统一换行符
                if (optUnifyLineBreaks.checked) {
                    result = result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                }

                // 2. 移除特殊符号
                if (optRemoveSpecial.checked) {
                    const defaultPunctuation = '，。？！；：“”‘’、·—…《》【】（）,.?!;:\'"()[]{}';
                    let userKeep = keepCharsInput.value || '';
                    userKeep = userKeep.replace(/\s/g, '');
                    let allKeep = defaultPunctuation + userKeep;
                    let escapedKeep = escapeRegExp(allKeep);
                    const regex = new RegExp(`[^a-zA-Z0-9\\u4e00-\\u9fa5\\s\\n${escapedKeep}]`, 'g');
                    result = result.replace(regex, '');
                }

                // 3. 去除首尾空格
                if (optTrim.checked) {
                    result = result.split('\n').map(line => line.trim()).join('\n');
                }

                // 4. 空格处理（核心修复）
                if (optRemoveAllSpaces.checked) {
                    // 如果同时勾选了“保留音频格式”，先保护“讲话人 时间码”结构中的空格
                    if (optKeepTranscriptFormat.checked) {
                        // 用特殊占位符替换关键空格
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        // 移除所有普通空格
                        result = result.replace(/ /g, '');
                        // 还原关键空格
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/ /g, '');
                    }
                } else if (optMultipleSpaces.checked) {
                    if (optKeepTranscriptFormat.checked) {
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        result = result.replace(/[ ]{2,}/g, ' ');
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/[ ]{2,}/g, ' ');
                    }
                }

                // 5. 段首缩进两格（修复）
                if (optIndent.checked) {
                    const lines = result.split('\n');
                    const indentedLines = lines.map(line => {
                        if (line.trim() === '') return line;
                        return '　　' + line;
                    });
                    result = indentedLines.join('\n');
                }

                // 6. 行距处理（修复）
                let lineHeightValue = parseFloat(lineHeightInput.value);
                if (isNaN(lineHeightValue) || lineHeightValue < 12) {
                    lineHeightValue = 28;
                    lineHeightInput.value = 28;
                }
                // 将磅值映射为段间空行数：每增加12磅约等于一个空行
                const extraLineBreaks = Math.round((lineHeightValue - 12) / 12);
                const numBreaks = Math.min(Math.max(extraLineBreaks, 0), 4);

                let lines = result.split('\n');
                let nonEmptyLines = lines.filter(line => line.trim() !== '');

                if (numBreaks > 0) {
                    // 每段后面加 numBreaks 个换行符
                    let separatedText = nonEmptyLines.map(line => {
                        return line + '\n'.repeat(numBreaks);
                    }).join('');
                    result = separatedText.replace(/\n+$/, '');
                } else {
                    result = nonEmptyLines.join('\n');
                }

                // 7. 删除空行（如果勾选，在最终结果上再执行一次）
                if (optRemoveEmptyLines.checked) {
                    result = result.split('\n').filter(line => line.trim() !== '').join('\n');
                }

                // 8. 大小写转换
                if (optUpperCase.checked) {
                    result = result.toUpperCase();
                } else if (optLowerCase.checked) {
                    result = result.toLowerCase();
                } else if (optCapitalize.checked) {
                    result = result.replace(/(?:^|\.\s+|\!\s+|\?\s+)([a-z])/g, (match, p1) => match.toUpperCase());
                    if (result.length > 0) {
                        result = result.charAt(0).toUpperCase() + result.slice(1);
                    }
                }

                // 9. 人民币大写金额转换（修复：放在最后，确保对其他结果生效）
                if (optMoneyUppercase.checked) {
                    result = convertMoneyInText(result);
                }
            } catch (e) {
                console.error('Clean error:', e);
                return text;
            }

            return result;
        }

        // ---------- 更新视图 ----------
        function updateDisplay() {
            const raw = inputEl.value;
            const cleaned = cleanText(raw);
            if (inputEl.value !== cleaned) {
                inputEl.value = cleaned;
            }

            const text = cleaned;
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            const lineCount = text === '' ? 0 : text.split('\n').length;

            charSpan.textContent = charCount;
            wordSpan.textContent = wordCount;
            lineSpan.textContent = lineCount;
        }

        let timer = null;
        function scheduleUpdate() {
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                updateDisplay();
                timer = null;
            }, 50);
        }

        // ---------- 事件绑定 ----------
        inputEl.addEventListener('input', scheduleUpdate);
        keepCharsInput.addEventListener('input', scheduleUpdate);
        lineHeightInput.addEventListener('input', scheduleUpdate);

        const allCheckboxes = document.querySelectorAll('.option-item input[type="checkbox"]');
        allCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.id === 'optUpperCase' && cb.checked) {
                    optLowerCase.checked = false;
                    optCapitalize.checked = false;
                } else if (cb.id === 'optLowerCase' && cb.checked) {
                    optUpperCase.checked = false;
                    optCapitalize.checked = false;
                } else if (cb.id === 'optCapitalize' && cb.checked) {
                    optUpperCase.checked = false;
                    optLowerCase.checked = false;
                }
                if (cb.id === 'optRemoveAllSpaces' && cb.checked) {
                    optMultipleSpaces.checked = false;
                } else if (cb.id === 'optMultipleSpaces' && cb.checked) {
                    optRemoveAllSpaces.checked = false;
                }
                scheduleUpdate();
            });
        });

        // ---------- 复制 ----------
        copyBtn.addEventListener('click', async () => {
            const text = inputEl.value;
            if (!text) {
                alert('没有内容可复制');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = '📋 复制结果'; }, 1500);
            } catch {
                inputEl.select();
                document.execCommand('copy');
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = '📋 复制结果'; }, 1500);
            }
        });

        // ---------- 下载 ----------
        downloadBtn.addEventListener('click', () => {
            const text = inputEl.value;
            if (!text) {
                alert('没有内容可下载');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cleaned_text_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // ---------- 重置 ----------
        resetBtn.addEventListener('click', () => {
            inputEl.value = '';
            optTrim.checked = true;
            optMultipleSpaces.checked = true;
            optRemoveAllSpaces.checked = false;
            optRemoveEmptyLines.checked = true;
            optUnifyLineBreaks.checked = true;
            optRemoveSpecial.checked = false;
            optUpperCase.checked = false;
            optLowerCase.checked = false;
            optCapitalize.checked = false;
            optKeepTranscriptFormat.checked = false;
            optIndent.checked = false;
            optMoneyUppercase.checked = false;
            lineHeightInput.value = '28';
            keepCharsInput.value = '';
            updateDisplay();
        });

        // ---------- 暗色主题 ----------
        let darkMode = false;
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            themeToggle.textContent = darkMode ? '☀️ 亮色' : '🌙 暗色';
        });

        // ---------- 多语言切换（简化：仅切换界面文字） ----------
        let lang = 'zh';
        const i18n = {
            zh: {
                title: '🧹 文本清理工具',
                reset: '↺ 重置',
                langToggle: '🌐 English',
                themeDark: '🌙 暗色',
                themeLight: '☀️ 亮色',
                placeholder: '在此粘贴或输入需要清理的文本……',
                privacy: '所有处理在本地完成 · 不上传服务器',
                copy: '📋 复制结果',
                download: '⬇ 下载 .txt',
                copied: '✅ 已复制',
            },
            en: {
                title: '🧹 Text Cleaner',
                reset: '↺ Reset',
                langToggle: '🌐 中文',
                themeDark: '🌙 Dark',
                themeLight: '☀️ Light',
                placeholder: 'Paste or type your text here…',
                privacy: 'All processing is done locally · No data uploaded',
                copy: '📋 Copy Result',
                download: '⬇ Download .txt',
                copied: '✅ Copied!',
            }
        };

        function updateLanguage(langCode) {
            const dict = i18n[langCode] || i18n.zh;
            document.getElementById('siteTitle').textContent = dict.title;
            document.getElementById('resetBtn').textContent = dict.reset;
            document.getElementById('langToggle').textContent = dict.langToggle;
            document.getElementById('inputText').placeholder = dict.placeholder;
            document.querySelector('.privacy-badge span').textContent = dict.privacy;
            document.getElementById('copyBtn').textContent = dict.copy;
            document.getElementById('downloadBtn').textContent = dict.download;
            // 主题按钮文字
            themeToggle.textContent = darkMode ? dict.themeLight : dict.themeDark;
        }

        langToggle.addEventListener('click', () => {
            lang = lang === 'zh' ? 'en' : 'zh';
            updateLanguage(lang);
        });

        // ---------- 初始化 ----------
        updateLanguage('zh');
        themeToggle.textContent = '🌙 暗色';
        updateDisplay();
        window.addEventListener('load', function() {
            updateDisplay();
        });
    })();
</script>
</body>
</html>
