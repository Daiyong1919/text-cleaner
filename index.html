<script>
    (function() {
        // ---------- 多语言字典 ----------
        const i18n = {
            en: {
                siteTitle: '🧹 Text Cleaner',
                optTrim: 'Trim leading/trailing spaces',
                optMultipleSpaces: 'Collapse multiple spaces',
                optRemoveAllSpaces: 'Remove all spaces (Chinese/English)',
                optRemoveEmptyLines: 'Delete empty lines',
                optUnifyLineBreaks: 'Unify line breaks (LF)',
                optRemoveSpecial: 'Remove special symbols (keep letters/numbers/Chinese)',
                optUpperCase: 'UPPER CASE',
                optLowerCase: 'lower case',
                optCapitalize: 'Capitalize sentences',
                optKeepTranscriptFormat: '🔊 Keep audio transcript format (speaker + timestamp)',
                optIndent: 'Indent first line (2 spaces)',
                optLineHeight: 'Line height:',
                unitLabel: 'pt',
                cnLabel: '🇨🇳 Chinese Layout',
                caseLabel: 'Case:',
                statsChars: 'Characters',
                statsWords: 'Words',
                statsLines: 'Lines',
                copyBtn: '📋 Copy Result',
                downloadBtn: '⬇ Download .txt',
                privacy: 'All processing is done locally · No data uploaded',
                copySuccess: '✅ Copied!',
                copyDefault: '📋 Copy Result',
                resetBtn: '↺ Reset',
                themeDark: '🌙 Dark',
                themeLight: '☀️ Light',
                langToggle: '🌐 中文',
                placeholder: 'Paste or type your text here…',
                alertNoContent: 'No content to copy',
                alertNoDownload: 'No content to download',
                hintSpaces: '💡 "Collapse" keeps single spaces; "Remove all" deletes every space.',
                keepLabel: 'Keep extra chars:',
                keepHint: '(common punctuation kept by default)',
            },
            zh: {
                siteTitle: '🧹 文本清理工具',
                optTrim: '去除首尾空格',
                optMultipleSpaces: '合并多个空格',
                optRemoveAllSpaces: '移除所有空格（中文/英文）',
                optRemoveEmptyLines: '删除空行',
                optUnifyLineBreaks: '统一换行符 (LF)',
                optRemoveSpecial: '移除特殊符号（保留字母/数字/中文）',
                optUpperCase: '转大写',
                optLowerCase: '转小写',
                optCapitalize: '首字母大写（每句）',
                optKeepTranscriptFormat: '🔊 保留音频转文字稿格式（讲话人 + 时间码）',
                optIndent: '段首缩进两格',
                optLineHeight: '行距：',
                unitLabel: '磅',
                cnLabel: '🇨🇳 中文排版',
                caseLabel: '大小写：',
                statsChars: '字符数',
                statsWords: '单词数',
                statsLines: '行数',
                copyBtn: '📋 复制结果',
                downloadBtn: '⬇ 下载 .txt',
                privacy: '所有处理在本地完成 · 不上传服务器',
                copySuccess: '✅ 已复制',
                copyDefault: '📋 复制结果',
                resetBtn: '↺ 重置',
                themeDark: '🌙 暗色',
                themeLight: '☀️ 亮色',
                langToggle: '🌐 English',
                placeholder: '在此粘贴或输入需要清理的文本……',
                alertNoContent: '没有内容可复制',
                alertNoDownload: '没有内容可下载',
                hintSpaces: '💡 “合并多个空格”只将多个空格缩成一个，不删除单个空格；“移除所有空格”会删除全部空格。',
                keepLabel: '保留额外字符：',
                keepHint: '（常用标点已默认保留）',
            }
        };

        let currentLang = 'en';

        // ---------- 语言切换核心函数 ----------
        function updateLanguage(lang) {
            const dict = i18n[lang] || i18n.en;
            document.getElementById('siteTitle').textContent = dict.siteTitle;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) {
                    if (el.closest('#statsDisplay')) {
                        const numberSpan = el.querySelector('span');
                        if (numberSpan) {
                            el.childNodes[0]?.textContent ? el.childNodes[0].textContent = dict[key] + ' ' : el.textContent = dict[key] + ' ';
                            el.appendChild(numberSpan);
                        } else {
                            el.textContent = dict[key];
                        }
                    } else {
                        el.textContent = dict[key];
                    }
                }
            });
            document.getElementById('inputText').placeholder = dict.placeholder;
            document.getElementById('resetBtn').textContent = dict.resetBtn;
            document.getElementById('langToggle').textContent = lang === 'en' ? '🌐 中文' : '🌐 English';
            copyBtn.textContent = dict.copyBtn;
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            themeToggle.textContent = dark ? dict.themeLight : dict.themeDark;
            document.getElementById('keepCharsInput').placeholder = lang === 'en' ? 'e.g. # @ ￥ / +' : '例如 # @ ￥ / +';
        }

        // ---------- DOM 引用 ----------
        const inputEl = document.getElementById('inputText');
        const charSpan = document.getElementById('charCount');
        const wordSpan = document.getElementById('wordCount');
        const lineSpan = document.getElementById('lineCount');

        const optTrim = document.getElementById('optTrim');
        const optMultipleSpaces = document.getElementById('optMultipleSpaces');
        const optRemoveAllSpaces = document.getElementById('optRemoveAllSpaces');
        const optRemoveEmptyLines = document.getElementById('optRemoveEmptyLines');
        const optUnifyLineBreaks = document.getElementById('optUnifyLineBreaks');
        const optRemoveSpecial = document.getElementById('optRemoveSpecial');
        const optUpperCase = document.getElementById('optUpperCase');
        const optLowerCase = document.getElementById('optLowerCase');
        const optCapitalize = document.getElementById('optCapitalize');
        const optKeepTranscriptFormat = document.getElementById('optKeepTranscriptFormat');
        const optIndent = document.getElementById('optIndent');
        const lineHeightInput = document.getElementById('lineHeightInput');
        const keepCharsInput = document.getElementById('keepCharsInput');

        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');

        // ---------- 工具：正则转义 ----------
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ---------- 核心清理函数 ----------
        function cleanText(text) {
            if (!text) return '';

            let result = text;

            try {
                // 1. 统一换行符
                if (optUnifyLineBreaks.checked) {
                    result = result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                }

                // 2. 移除特殊符号
                if (optRemoveSpecial.checked) {
                    const defaultPunctuation = '，。？！；：“”‘’、·—…《》【】（）,.?!;:\'"()[]{}';
                    let userKeep = keepCharsInput.value || '';
                    userKeep = userKeep.replace(/\s/g, '');
                    let allKeep = defaultPunctuation + userKeep;
                    let escapedKeep = escapeRegExp(allKeep);
                    const regex = new RegExp(`[^a-zA-Z0-9\\u4e00-\\u9fa5\\s\\n${escapedKeep}]`, 'g');
                    result = result.replace(regex, '');
                }

                // 3. 去除首尾空格 (每行)
                if (optTrim.checked) {
                    result = result.split('\n').map(line => line.trim()).join('\n');
                }

                // 4. 空格处理
                if (optRemoveAllSpaces.checked) {
                    if (optKeepTranscriptFormat.checked) {
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        result = result.replace(/ /g, '');
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/ /g, '');
                    }
                } else if (optMultipleSpaces.checked) {
                    if (optKeepTranscriptFormat.checked) {
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        result = result.replace(/[ ]{2,}/g, ' ');
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/[ ]{2,}/g, ' ');
                    }
                }

                // 5. 段首缩进两格
                if (optIndent.checked) {
                    const lines = result.split('\n');
                    const indentedLines = lines.map(line => {
                        if (line.trim() === '') return line;
                        return '　　' + line;
                    });
                    result = indentedLines.join('\n');
                }

                // 6. 行距处理
                let lineHeightValue = parseFloat(lineHeightInput.value);
                if (isNaN(lineHeightValue) || lineHeightValue < 12) {
                    lineHeightValue = 28;
                    lineHeightInput.value = 28;
                }
                const extraLineBreaks = Math.round((lineHeightValue - 12) / 12);
                const numBreaks = Math.min(Math.max(extraLineBreaks, 0), 4);

                let lines = result.split('\n');
                let nonEmptyLines = lines.filter(line => line.trim() !== '');

                if (numBreaks > 0) {
                    let separatedText = nonEmptyLines.map(line => {
                        return line + '\n'.repeat(numBreaks);
                    }).join('');
                    result = separatedText.replace(/\n+$/, '');
                } else {
                    result = nonEmptyLines.join('\n');
                }

                // 7. 删除空行
                if (optRemoveEmptyLines.checked) {
                    result = result.split('\n').filter(line => line.trim() !== '').join('\n');
                }

                // 8. 大小写转换
                if (optUpperCase.checked) {
                    result = result.toUpperCase();
                } else if (optLowerCase.checked) {
                    result = result.toLowerCase();
                } else if (optCapitalize.checked) {
                    result = result.replace(/(?:^|\.\s+|\!\s+|\?\s+)([a-z])/g, (match, p1) => match.toUpperCase());
                    if (result.length > 0) {
                        result = result.charAt(0).toUpperCase() + result.slice(1);
                    }
                }
            } catch (e) {
                // 如果处理过程中出错，返回原文本
                console.error('Clean error:', e);
                return text;
            }

            return result;
        }
