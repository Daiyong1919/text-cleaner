        // ---------- 工具函数：数字转中文大写金额 ----------
        function numberToChinese(num) {
            if (isNaN(num) || num === null || num === undefined) return '';
            const digits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            const units = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿', '拾', '佰', '仟'];
            const decimalUnits = ['角', '分'];

            let numStr = num.toString();
            let parts = numStr.split('.');
            let integerPart = parts[0];
            let decimalPart = parts.length > 1 ? parts[1].padEnd(2, '0') : '00';

            if (integerPart === '0' && decimalPart === '00') return '零元整';

            // 转换整数部分
            let result = '';
            let integerDigits = integerPart.split('').reverse();
            let zeroFlag = false;

            for (let i = 0; i < integerDigits.length; i++) {
                let digit = parseInt(integerDigits[i]);
                let unit = units[i] || '';
                if (digit === 0) {
                    zeroFlag = true;
                    continue;
                }
                if (zeroFlag) {
                    result = '零' + result;
                    zeroFlag = false;
                }
                result = digits[digit] + unit + result;
            }
            result += '元';

            // 转换小数部分
            let jiao = parseInt(decimalPart[0]);
            let fen = parseInt(decimalPart[1]);
            if (jiao === 0 && fen === 0) {
                result += '整';
            } else {
                if (jiao > 0) {
                    result += digits[jiao] + '角';
                }
                if (fen > 0) {
                    result += digits[fen] + '分';
                }
            }
            return result;
        }

        // ---------- 文本中的金额转换 ----------
        function convertMoneyInText(text) {
            // 匹配金额模式：数字（含小数），后面可跟"元"或"块"
            const regex = /(\d+\.?\d*)\s*[元块]/g;
            return text.replace(regex, (match, num) => {
                const chinese = numberToChinese(parseFloat(num));
                return chinese || match;
            });
        }

        // ---------- 核心清理函数 ----------
        function cleanText(text) {
            if (!text) return '';

            let result = text;

            try {
                // 1. 统一换行符
                if (optUnifyLineBreaks.checked) {
                    result = result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                // 2. 移除特殊符号
                if (optRemoveSpecial.checked) {
                    const defaultPunctuation = '，。？！；：“”‘’、·—…《》【】（）,.?!;:\'"()[]{}';
                    let userKeep = keepCharsInput.value || '';
                    userKeep = userKeep.replace(/\s/g, '');
                    let allKeep = defaultPunctuation + userKeep;
                    let escapedKeep = escapeRegExp(allKeep);
                    const regex = new RegExp(`[^a-zA-Z0-9\\u4e00-\\u9fa5\\s\\n${escapedKeep}]`, 'g');
                    result = result.replace(regex, '');
                }

                // 3. 去除首尾空格
                if (optTrim.checked) {
                    result = result.split('\n').map(line => line.trim()).join('\n');
                }

                // 4. 空格处理
                if (optRemoveAllSpaces.checked) {
                    if (optKeepTranscriptFormat.checked) {
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        result = result.replace(/ /g, '');
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/ /g, '');
                    }
                } else if (optMultipleSpaces.checked) {
                    if (optKeepTranscriptFormat.checked) {
                        result = result.replace(/([^\s]+)\s+(\d{2}:\d{2}(?::\d{2})?)\s+([^\n]*)/g, (match, speaker, timestamp, content) => {
                            return speaker + '|||SPACE1|||' + timestamp + '|||SPACE2|||' + content;
                        });
                        result = result.replace(/[ ]{2,}/g, ' ');
                        result = result.replace(/\|\|\|SPACE1\|\|\|/g, ' ').replace(/\|\|\|SPACE2\|\|\|/g, ' ');
                    } else {
                        result = result.replace(/[ ]{2,}/g, ' ');
                    }
                }

                // 5. 段首缩进两格
                if (optIndent.checked) {
                    const lines = result.split('\n');
                    const indentedLines = lines.map(line => {
                        if (line.trim() === '') return line;
                        return '　　' + line;
                    });
                    result = indentedLines.join('\n');
                }

                // 6. 行距处理
                let lineHeightValue = parseFloat(lineHeightInput.value);
                if (isNaN(lineHeightValue) || lineHeightValue < 12) {
                    lineHeightValue = 28;
                    lineHeightInput.value = 28;
                }
                const extraLineBreaks = Math.round((lineHeightValue - 12) / 12);
                const numBreaks = Math.min(Math.max(extraLineBreaks, 0), 4);

                let lines = result.split('\n');
                let nonEmptyLines = lines.filter(line => line.trim() !== '');

                if (numBreaks > 0) {
                    let separatedText = nonEmptyLines.map(line => {
                        return line + '\n'.repeat(numBreaks);
                    }).join('');
                    result = separatedText.replace(/\n+$/, '');
                } else {
                    result = nonEmptyLines.join('\n');
                }

                // 7. 删除空行
                if (optRemoveEmptyLines.checked) {
                    result = result.split('\n').filter(line => line.trim() !== '').join('\n');
                }

                // 8. 大小写转换
                if (optUpperCase.checked) {
                    result = result.toUpperCase();
                } else if (optLowerCase.checked) {
                    result = result.toLowerCase();
                } else if (optCapitalize.checked) {
                    result = result.replace(/(?:^|\.\s+|\!\s+|\?\s+)([a-z])/g, (match, p1) => match.toUpperCase());
                    if (result.length > 0) {
                        result = result.charAt(0).toUpperCase() + result.slice(1);
                    }
                }

                // 9. 人民币大写金额转换（放在最后，对其他转换结果进行处理）
                if (optMoneyUppercase.checked) {
                    result = convertMoneyInText(result);
                }
            } catch (e) {
                console.error('Clean error:', e);
                return text;
            }

            return result;
        }

        // ---------- 更新视图 ----------
        function updateDisplay() {
            const raw = inputEl.value;
            const cleaned = cleanText(raw);
            if (inputEl.value !== cleaned) {
                inputEl.value = cleaned;
            }

            const text = cleaned;
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            const lineCount = text === '' ? 0 : text.split('\n').length;

            charSpan.textContent = charCount;
            wordSpan.textContent = wordCount;
            lineSpan.textContent = lineCount;
        }

        let timer = null;
        function scheduleUpdate() {
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                updateDisplay();
                timer = null;
            }, 50);
        }

        // ---------- 事件绑定 ----------
        inputEl.addEventListener('input', scheduleUpdate);
        keepCharsInput.addEventListener('input', scheduleUpdate);
        lineHeightInput.addEventListener('input', scheduleUpdate);

        const allCheckboxes = document.querySelectorAll('.option-item input[type="checkbox"]');
        allCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.id === 'optUpperCase' && cb.checked) {
                    optLowerCase.checked = false;
                    optCapitalize.checked = false;
                } else if (cb.id === 'optLowerCase' && cb.checked) {
                    optUpperCase.checked = false;
                    optCapitalize.checked = false;
                } else if (cb.id === 'optCapitalize' && cb.checked) {
                    optUpperCase.checked = false;
                    optLowerCase.checked = false;
                }
                if (cb.id === 'optRemoveAllSpaces' && cb.checked) {
                    optMultipleSpaces.checked = false;
                } else if (cb.id === 'optMultipleSpaces' && cb.checked) {
                    optRemoveAllSpaces.checked = false;
                }
                scheduleUpdate();
            });
        });

        // ---------- 复制 ----------
        copyBtn.addEventListener('click', async () => {
            const text = inputEl.value;
            if (!text) {
                alert(i18n[currentLang].alertNoContent);
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                const dict = i18n[currentLang];
                copyBtn.textContent = dict.copySuccess;
                setTimeout(() => { copyBtn.textContent = dict.copyBtn; }, 1500);
            } catch {
                inputEl.select();
                document.execCommand('copy');
                const dict = i18n[currentLang];
                copyBtn.textContent = dict.copySuccess;
                setTimeout(() => { copyBtn.textContent = dict.copyBtn; }, 1500);
            }
        });

        // ---------- 下载 ----------
        downloadBtn.addEventListener('click', () => {
            const text = inputEl.value;
            if (!text) {
                alert(i18n[currentLang].alertNoDownload);
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cleaned_text_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // ---------- 重置 ----------
        resetBtn.addEventListener('click', () => {
            inputEl.value = '';
            optTrim.checked = true;
            optMultipleSpaces.checked = true;
            optRemoveAllSpaces.checked = false;
            optRemoveEmptyLines.checked = true;
            optUnifyLineBreaks.checked = true;
            optRemoveSpecial.checked = false;
            optUpperCase.checked = false;
            optLowerCase.checked = false;
            optCapitalize.checked = false;
            optKeepTranscriptFormat.checked = false;
            optIndent.checked = false;
            optMoneyUppercase.checked = false;
            lineHeightInput.value = '28';
            keepCharsInput.value = '';
            updateDisplay();
        });

        // ---------- 暗色主题 ----------
        let darkMode = false;
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            const dict = i18n[currentLang];
            themeToggle.textContent = darkMode ? dict.themeLight : dict.themeDark;
        });

        // ---------- 多语言切换 ----------
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLanguage(currentLang);
            const dict = i18n[currentLang];
            themeToggle.textContent = darkMode ? dict.themeLight : dict.themeDark;
            copyBtn.textContent = dict.copyBtn;
        });

        // ---------- 初始化 ----------
        updateLanguage('zh');
        themeToggle.textContent = '🌙 暗色';
        updateDisplay();
        window.addEventListener('load', function() {
            updateDisplay();
        });
    })();
</script>

</body>
</html>
